        function parseCSV(data) {
            const lines = data.trim().split('\n');
            const headers = lines.shift().split(',').map(h => h.trim());
            const yearIndex = headers.indexOf('year');
            const annIndex = headers.indexOf('ann');

            return lines.map(line => {
                const values = line.split(',').map(v => v.trim());
                const year = values[yearIndex];
                const annualValue = parseFloat(values[annIndex]);
                if (year && !isNaN(annualValue)) {
                    return { label: year, value: annualValue };
                }
                return null;
            }).filter(item => item !== null);
        }

        const dataset = parseCSV(csvData);

        function drawChart() {
            const svg = document.getElementById('chart');
            const tooltip = document.getElementById('tooltip');
            svg.innerHTML = ''; 

            const svgWidth = svg.clientWidth;
            const svgHeight = svg.clientHeight;
            const barPadding = 1;
            const barWidth = (svgWidth / dataset.length) - barPadding;
            const maxValue = Math.ceil(Math.max(...dataset.map(d => d.value)) / 10) * 10 + 10;

            dataset.forEach((dataPoint, index) => {
                const barHeight = (dataPoint.value / maxValue) * svgHeight;
                const barX = index * (barWidth + barPadding);
                const finalY = svgHeight - barHeight;

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', 'bar-container');
                svg.appendChild(g);

                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', barX);
                rect.setAttribute('y', svgHeight);
                rect.setAttribute('width', barWidth);
                rect.setAttribute('height', 0);
                rect.setAttribute('fill', '#54A9A4');
                rect.setAttribute('class', 'bar');
                g.appendChild(rect);

                if ((parseInt(dataPoint.label) % 10 === 0) || index === 0 || index === dataset.length -1) {
                    const textLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    textLabel.setAttribute('class', 'label');
                    textLabel.setAttribute('x', barX + barWidth / 2);
                    textLabel.setAttribute('y', svgHeight + 15);
                    textLabel.textContent = dataPoint.label;
                    svg.appendChild(textLabel);
                }
                
                g.addEventListener('mouseover', () => {
                    let tooltipText = `<strong>${dataPoint.label}:</strong> ${dataPoint.value} days`;
                    if (dataPoint.label === '2025') {
                        tooltipText += ' (to Oct)';
                    }
                    tooltip.innerHTML = tooltipText;
                    tooltip.style.opacity = '1';
                });
                g.addEventListener('mousemove', (event) => {
                    tooltip.style.left = `${event.pageX + 15}px`;
                    tooltip.style.top = `${event.pageY - 10}px`;
                });
                g.addEventListener('mouseout', () => {
                    tooltip.style.opacity = '0';
                });

                setTimeout(() => {
                    rect.setAttribute('y', finalY);
                    rect.setAttribute('height', barHeight);
                }, 100 + index * 10);
            });
        }
        
        const animateButton = document.getElementById('animateButton');
        animateButton.addEventListener('click', drawChart);
        
        window.addEventListener('load', drawChart);
        window.addEventListener('resize', drawChart);
